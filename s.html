<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Groq AI Chatbot</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .chat-container {
      width: 95%;
      max-width: 700px;
      height: 650px;
      background: #1f2937;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    }

    .header {
      padding: 20px;
      background: #2563eb;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }

    .messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .message {
      max-width: 80%;
      padding: 12px 16px;
      margin-bottom: 12px;
      border-radius: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .user {
      margin-left: auto;
      background: #2563eb;
    }

    .bot {
      margin-right: auto;
      background: #374151;
    }

    .input-area {
      display: flex;
      gap: 10px;
      padding: 15px;
      background: #111827;
    }

    input {
      flex: 1;
      padding: 14px;
      border: none;
      outline: none;
      border-radius: 10px;
      background: #374151;
      color: white;
      font-size: 15px;
    }

    button {
      border: none;
      padding: 0 20px;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      background: #4b5563;
      cursor: not-allowed;
    }
  </style>
</head>

<body>

  <div class="chat-container">

    <div class="header">
      🤖 Groq AI Chatbot
    </div>

    <div class="messages" id="messages">
      <div class="message bot">
        Hello! 👋 How can I help you?
      </div>
    </div>

    <div class="input-area">
      <input
        type="text"
        id="userInput"
        placeholder="Ask something..."
        autocomplete="off"
      />

      <button id="sendBtn" onclick="sendMessage()">
        Send
      </button>
    </div>

  </div>

  <script>

    // ⚠️ DEMO ONLY
    // Never expose your API key in frontend code in production.
    const GROQ_API_KEY = "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";
    const API_KEY = "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";

    const messages = document.getElementById("messages");
    const input = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");

    // Conversation history
    const chatHistory = [
      {
        role: "system",
        content: "You are a helpful, friendly and concise AI assistant."
      }
    ];

    async function sendMessage() {

      const userText = input.value.trim();

      if (!userText) return;

      // Show user message
      addMessage(userText, "user");

      // Add to conversation
      chatHistory.push({
        role: "user",
        content: userText
      });

      input.value = "";

      sendBtn.disabled = true;
      sendBtn.textContent = "Thinking...";

      // Temporary loading message
      const loadingMessage = addMessage(
        "Thinking...",
        "bot"
      );

      try {

        const response = await fetch(
          // "https://api.groq.com/openai/v1/chat/completions",
          "https://openrouter.ai/api/v1/chat/completions",
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json",
              "Authorization": `Bearer ${API_KEY}`
            },

            body: JSON.stringify({
              // model: "openai/gpt-oss-120b",
              model: "qwen/qwen3-32b",

              messages: chatHistory,

              temperature: 0.7,

              max_tokens: 500
            })
          }
        );

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.error?.message || "API request failed"
          );
        }

        const reply =
          data.choices[0].message.content;

        // Remove loading message
        loadingMessage.remove();

        // Show AI response
        addMessage(reply, "bot");

        // Save AI response
        chatHistory.push({
          role: "assistant",
          content: reply
        });

      } catch (error) {

        loadingMessage.textContent =
          "❌ Error: " + error.message;

        console.error(error);

      } finally {

        sendBtn.disabled = false;
        sendBtn.textContent = "Send";

        input.focus();
      }
    }


    function addMessage(text, type) {

      const message = document.createElement("div");

      message.classList.add(
        "message",
        type
      );

      message.textContent = text;

      messages.appendChild(message);

      messages.scrollTop =
        messages.scrollHeight;

      return message;
    }


    // Press Enter to send
    input.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {
          sendMessage();
        }

      }
    );

  </script>

</body>
</html>
